name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Find project
        id: find
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle NOT FOUND. Files in repository:"
            find . -not -path './.git/*' | head -80
            exit 1
          fi
          echo "Found: $f"
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: anchors-mod
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
